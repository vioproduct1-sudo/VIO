name: VIO CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run build:direct
      - run: npm test
      - run: sh -n deploy/install.sh && sh -n deploy/update.sh
      - run: npm audit --omit=dev --audit-level=moderate
      - run: docker build -t vio:ci .
      - name: Подготовить пакет для NAS
        run: tar -czf VIO-NAS.tar.gz Dockerfile compose.yaml package.json package-lock.json server web scripts msx README.md deploy .env.example
      - uses: actions/upload-artifact@v4
        with:
          name: VIO-NAS
          path: VIO-NAS.tar.gz
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :android:assembleDebug :android:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VIO-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: android/build/reports/
