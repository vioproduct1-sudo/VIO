name: MSX GitHub
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-msx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Проверить опубликованные JSON и ссылки
        run: node --test test/static-msx.test.mjs
      - name: Собрать пакет MSX
        run: node scripts/export-msx.mjs msx-package
      - uses: actions/upload-artifact@v4
        with:
          name: VIO-Media-Station-X
          path: msx-package/
          if-no-files-found: error
