services:
  vio:
    build: .
    container_name: vio-tv
    ports: ["8088:8080"]
    environment:
      VIO_ADMIN_PASSWORD: ${VIO_ADMIN_PASSWORD:?Set initial admin password}
      PUBLIC_URL: ${PUBLIC_URL:-http://192.168.8.222:8088}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    volumes: ["vio-data:/app/data"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
volumes:
  vio-data:
